# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: esp32-s3
  friendly_name: esp32-s3

esp32:
  variant: esp32s3
  framework:
    type: arduino
logger:

api:
  encryption:
    key: "tmizGi9TA4CennO3nKi7jY1RleOHhrp5oa63kKlly+Y="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: !secret esp32s3_static_ip
    gateway: !secret network_gateway
    subnet: !secret network_subnet
    dns1: !secret network_dns1
    dns2: !secret network_dns2

  ap:
    ssid: !secret esp32s3_fallback_ssid
    password: !secret esp32s3_fallback_password

captive_portal:

sensor:
  - platform: internal_temperature
    name: "ESP32-S3 Dahili Sıcaklık"

  - platform: uptime
    name: "ESP32-S3 Çalışma Süresi"

  - platform: template
    name: "ESP32-S3 Boş RAM"
    lambda: |-
      return (float)esp_get_free_heap_size();
    unit_of_measurement: "B"
    icon: "mdi:memory"

  - platform: wifi_signal
    name: "ESP32-S3 Wi-Fi Sinyal Gücü"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "ESP32-S3 Bağlantı Durumu"

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: WS2812
    pin: GPIO48
    num_leds: 1
    name: "Cihaz Durum Ledi"
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s
    
    
