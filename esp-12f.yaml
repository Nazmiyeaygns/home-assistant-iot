# Board: NodeMCU v2 (ESP8266) (NodeMCU)
# Definition: definitions/boards/nodemcuv2/manifest.yaml

esphome:
  name: esp-12f
  friendly_name: esp-12f

esp8266:
  board: nodemcuv2

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: !secret esp12f_static_ip
    gateway: !secret network_gateway
    subnet: !secret network_subnet
    dns1: !secret network_dns1
    dns2: !secret network_dns2

  ap:
    ssid: !secret esp12f_fallback_ssid
    password: !secret esp12f_fallback_password
captive_portal:

switch:
  platform: gpio
  name: "Röle"
  pin: GPIO4
  id: role_1
  restore_mode: ALWAYS_OFF
  
